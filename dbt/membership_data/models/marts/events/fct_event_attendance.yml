models:
  - name: fct_event_attendance
    description: "One row per member registration for an event, with their attendance outcome. Grain: event_attendance_id."
    columns:
      - name: event_attendance_id
        description: "The unique identifier for the event attendance record."
        data_type: integer
        data_tests:
          - not_null
          - unique
      - name: event_id
        description: "Foreign key to the event."
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event')
                field: event_id
      - name: member_id
        description: "Foreign key to the member who registered."
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: attendance_status
        description: "The outcome of the registration."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Registered', 'Attended', 'No Show', 'Cancelled']
      - name: registered_at
        description: "The timestamp the member registered for the event."
        data_type: timestamp
      - name: attended_at
        description: "The timestamp the member attended the event. Null unless attendance_status is 'Attended'."
        data_type: timestamp
      - name: is_attended
        description: "True if the member actually attended the event (attendance_status = 'Attended')."
        data_tests:
          - not_null
