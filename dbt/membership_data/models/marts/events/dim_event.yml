models:
  - name: dim_event
    description: "One row per event hosted by the association."
    semantic_model:
      enabled: true
    agg_time_dimension: event_date
    columns:
      - name: event_id
        description: "The unique identifier for the event."
        data_type: integer
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
          name: event
      - name: event_name
        description: "The name of the event."
        data_tests:
          - not_null
      - name: event_type
        description: "The type of event."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Conference', 'Workshop', 'Networking', 'Webinar', 'Training', 'Assembly']
        dimension:
          type: categorical
      - name: event_date
        description: "The date the event took place."
        data_type: date
        data_tests:
          - not_null
        granularity: day
        dimension:
          type: time
      - name: city
        description: "The city where the event was held."
        dimension:
          type: categorical
      - name: capacity
        description: "The maximum number of attendees the event could hold."
        data_tests:
          - not_null
    metrics:
      - name: events_hosted
        description: "Count of events hosted."
        type: simple
        agg: count
        expr: 1
