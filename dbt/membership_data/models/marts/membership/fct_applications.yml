models:
  - name: fct_applications
    description: "One row per membership application, with derived decision timing. Grain: application_id."
    semantic_model:
      enabled: true
    agg_time_dimension: submitted_at
    columns:
      - name: application_id
        description: "The unique identifier for the application."
        data_type: integer
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
          name: application
      - name: applicant_name
        description: "The full name of the applicant."
        data_tests:
          - not_null
      - name: email
        description: "The applicant's email address."
      - name: birth_date
        description: "The applicant's date of birth."
        data_type: date
      - name: profession
        description: "The applicant's stated profession."
      - name: company_id
        description: "Foreign key to the applicant's company."
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id
        entity:
          type: foreign
          name: company
      - name: country
        description: "The applicant's country."
        dimension:
          type: categorical
      - name: city
        description: "The applicant's city."
        dimension:
          type: categorical
      - name: application_type
        description: "The type of membership applied for."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Individual', 'Corporate', 'Student', 'Honorary']
        dimension:
          type: categorical
      - name: source_channel
        description: "The channel through which the application was received."
        dimension:
          type: categorical
      - name: status
        description: "The current status of the application."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Submitted', 'Under Review', 'Pending Payment', 'Approved', 'Rejected', 'Withdrawn']
        dimension:
          type: categorical
      - name: submitted_at
        description: "The timestamp when the application was submitted."
        data_type: timestamp
        data_tests:
          - not_null
        granularity: day
        dimension:
          type: time
      - name: decided_at
        description: "The timestamp the application reached a terminal status (Approved/Rejected/Withdrawn). Null while still in the pipeline."
        data_type: timestamp
        granularity: day
        dimension:
          type: time
      - name: days_to_decision
        description: "Days between submission and the terminal decision. Null while still in the pipeline."
        data_type: integer
      - name: is_approved
        description: "True if the application's current status is Approved."
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: member_id
        description: "Foreign key to the member created from this application, if approved. Null otherwise."
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
        entity:
          type: foreign
          name: member
    metrics:
      - name: applications_submitted
        description: "Count of applications submitted."
        type: simple
        agg: count
        expr: 1
      - name: applications_approved
        description: "Count of applications whose current status is Approved."
        type: simple
        agg: sum
        expr: "case when is_approved then 1 else 0 end"
      - name: avg_days_to_decision
        description: "Average number of days between an application's submission and its terminal decision (Approved/Rejected/Withdrawn)."
        type: simple
        agg: average
        expr: days_to_decision
