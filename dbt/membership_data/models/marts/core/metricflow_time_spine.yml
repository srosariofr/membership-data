models:
  - name: metricflow_time_spine
    description: "Daily date spine (2021-01-01 to 2027-01-01) used by MetricFlow for time-based metric queries."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests:
          - not_null
          - unique
