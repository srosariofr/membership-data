models:
  - name: dim_member
    description: "One row per member, with company attributes and current status derived from the member status history."
    semantic_model:
      enabled: true
    agg_time_dimension: registered_at
    columns:
      - name: member_id
        description: "The unique identifier for the member."
        data_type: integer
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
          name: member
      - name: application_id
        description: "Foreign key to the approved application that created this member."
        data_type: integer
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_applications')
                field: application_id
        entity:
          type: foreign
          name: application
      - name: name
        description: "The member's full name."
        data_tests:
          - not_null
        dimension:
          type: categorical
      - name: email
        description: "The member's email address."
        dimension:
          type: categorical
      - name: gender
        description: "The member's gender."
        dimension:
          type: categorical
      - name: birth_date
        description: "The member's date of birth."
        data_type: date
      - name: country
        description: "The member's country."
        dimension:
          type: categorical
      - name: city
        description: "The member's city."
        dimension:
          type: categorical
      - name: profession
        description: "The member's stated profession."
        dimension:
          type: categorical
      - name: company_id
        description: "Foreign key to the member's company."
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id
        entity:
          type: foreign
          name: company
      - name: company_name
        description: "The name of the member's company."
      - name: membership_type
        description: "The type of membership held."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Individual', 'Corporate', 'Student', 'Honorary']
        dimension:
          type: categorical
      - name: registered_at
        description: "The timestamp the underlying application was submitted."
        data_type: timestamp
        data_tests:
          - not_null
        granularity: day
        dimension:
          type: time
      - name: approved_at
        description: "The timestamp the underlying application was approved, creating the member."
        data_type: timestamp
        data_tests:
          - not_null
        granularity: day
        dimension:
          type: time
      - name: current_status
        description: "The member's current status, derived from the open status history record (status_end_at is null)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Pending Renewal', 'Inactive', 'Cancelled']
        dimension:
          type: categorical
      - name: current_status_start_at
        description: "The timestamp the member entered their current status."
        data_type: timestamp
        data_tests:
          - not_null
      - name: age_range
        description: "The member's age bucket, computed from birth_date as of the last dbt run."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Under 25', '25-34', '35-44', '45-54', '55-64', '65+']
        dimension:
          type: categorical
      - name: tenure_range
        description: "How long the member has held membership, bucketed from approved_at as of the last dbt run."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Under 1 year', '1-3 years', '3-5 years', '5+ years']
        dimension:
          type: categorical
    metrics:
      - name: members
        description: "Count of members."
        type: simple
        agg: count
        expr: 1
